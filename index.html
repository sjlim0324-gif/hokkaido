<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3446">
<title>홋카이도 가족여행 · 2026.09.04–09.08</title>
<meta name="description" content="2026년 9월 홋카이도 가족여행 일정표">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --fs:1;
    --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    --paper:#EEF1EC;
    --card:#FFFFFF;
    --ink:#17211F;
    --ink-soft:#3D4B45;
    --muted:#77857D;
    --line:#D8DED7;
    --rail:#2F4858;
    --now:#6E5AA6;
    --now-soft:#EDE8F6;
    --gold:#A8781F;
    --cash:#B5451B;
    --map:#1A6B4F;
    --d1:#A8781F;
    --d2:#2F4858;
    --d3:#6E5AA6;
    --d4:#3F6B4A;
    --d5:#2C6E8F;
    --shadow:0 1px 2px rgba(23,33,31,.06),0 8px 24px rgba(23,33,31,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:var(--sans);font-variant-numeric:tabular-nums;
    font-size:calc(16px * var(--fs));line-height:1.55;
    -webkit-font-smoothing:antialiased;padding-bottom:56px;
  }
  .wrap{max-width:560px;margin:0 auto}

  /* ---------- hero ---------- */
  header{position:relative;overflow:hidden;color:#fff;padding:0}
  .hero-art{position:absolute;inset:0;width:100%;height:100%;display:block}
  .hero-scrim{
    position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(18,32,44,.30) 0%,rgba(18,32,44,.42) 42%,rgba(18,32,44,.86) 100%);
  }
  .hero-in{position:relative;padding:78px 20px 18px}
  .eyebrow{
    font:700 calc(11px * var(--fs))/1 var(--sans);
    letter-spacing:.22em;text-transform:uppercase;
    color:rgba(255,255,255,.78);margin-bottom:10px;
    text-shadow:0 1px 6px rgba(0,0,0,.4);
  }
  h1{
    margin:0;font-size:calc(27px * var(--fs));font-weight:800;letter-spacing:-.025em;
    text-shadow:0 2px 12px rgba(0,0,0,.45);
  }
  .range{
    font-size:calc(14px * var(--fs));font-weight:500;
    color:rgba(255,255,255,.84);margin-top:5px;letter-spacing:.01em;
    text-shadow:0 1px 8px rgba(0,0,0,.4);
  }
  .clock{
    display:flex;align-items:baseline;gap:9px;margin-top:16px;
    padding-top:14px;border-top:1px solid rgba(255,255,255,.22);
  }
  .clock b{font-size:calc(23px * var(--fs));font-weight:600;letter-spacing:.01em}
  .clock span{font-size:calc(12px * var(--fs));color:rgba(255,255,255,.72)}
  .clock .dot{
    width:7px;height:7px;border-radius:50%;background:#8FE3B0;
    align-self:center;animation:blip 2.4s ease-in-out infinite;flex:0 0 auto;
  }
  @keyframes blip{0%,100%{opacity:1}50%{opacity:.28}}

  .fsbar{
    display:flex;align-items:center;gap:8px;
    margin-top:13px;padding-top:12px;border-top:1px solid rgba(255,255,255,.22);
  }
  .fsbar .lbl{font-size:calc(11.5px * var(--fs));color:rgba(255,255,255,.74);letter-spacing:.03em}
  .fsgrp{display:flex;gap:5px;margin-left:auto}
  .fsbtn{
    font-family:var(--sans);font-weight:700;color:#fff;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.34);
    border-radius:9px;padding:5px 12px;cursor:pointer;line-height:1.3;
    transition:transform .12s ease;backdrop-filter:blur(4px);
  }
  .fsbtn:active{transform:scale(.94)}
  .fsbtn[aria-pressed="true"]{background:#fff;color:var(--rail);border-color:#fff}
  .fsbtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
  .fsbtn.s1{font-size:13px}.fsbtn.s2{font-size:16px}.fsbtn.s3{font-size:19px}

  /* ---------- tabs ---------- */
  .tabs{
    position:sticky;top:0;z-index:20;
    background:rgba(238,241,236,.94);
    backdrop-filter:saturate(180%) blur(12px);
    -webkit-backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line);
    display:flex;gap:7px;overflow-x:auto;padding:10px 14px;scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;border:1px solid var(--line);background:var(--card);
    border-radius:11px;padding:7px 13px 8px;cursor:pointer;
    font-family:var(--sans);color:var(--ink-soft);text-align:left;
    transition:transform .12s ease;position:relative;
  }
  .tab:active{transform:scale(.96)}
  .tab .n{display:block;font-size:calc(16px * var(--fs));font-weight:700;line-height:1.05;letter-spacing:-.01em}
  .tab .d{display:block;font-size:calc(10.5px * var(--fs));color:var(--muted);margin-top:3px;white-space:nowrap}
  .tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .tab[aria-selected="true"] .d{color:rgba(255,255,255,.66)}
  .tab.today::after{
    content:"";position:absolute;top:-3px;right:-3px;width:9px;height:9px;
    border-radius:50%;background:var(--now);border:2px solid var(--paper);
  }
  .tab:focus-visible{outline:2px solid var(--now);outline-offset:2px}

  /* ---------- day head ---------- */
  .dayhead{padding:20px 20px 4px}
  .dayhead .num{
    font-size:calc(11.5px * var(--fs));letter-spacing:.2em;text-transform:uppercase;
    color:var(--accent);font-weight:800;
  }
  .dayhead h2{margin:5px 0 0;font-size:calc(21px * var(--fs));font-weight:800;letter-spacing:-.015em}
  .dayhead .sub{color:var(--muted);font-size:calc(13.5px * var(--fs));margin-top:5px}
  .stay{
    display:flex;gap:9px;align-items:flex-start;margin:14px 0 0;padding:11px 13px;
    background:var(--card);border:1px solid var(--line);
    border-left:3px solid var(--accent);border-radius:10px;
    font-size:calc(13px * var(--fs));box-shadow:var(--shadow);
  }
  .stay .k{color:var(--muted);flex:0 0 auto;font-size:calc(11.5px * var(--fs));padding-top:1px;letter-spacing:.04em}
  .stay .v{color:var(--ink-soft);line-height:1.45}
  .stay .v b{color:var(--ink);font-weight:700}

  /* ---------- timeline ---------- */
  .tl{position:relative;padding:16px 20px 8px;margin:0;list-style:none}
  .tl::before{content:"";position:absolute;left:33px;top:24px;bottom:26px;width:2px;background:var(--line)}
  .it{position:relative;padding:0 0 4px 40px;margin-bottom:14px}
  .mk{
    position:absolute;left:7px;top:5px;width:14px;height:14px;border-radius:50%;
    background:var(--card);border:2.5px solid var(--line);z-index:2;
  }
  .it.move .mk{border-color:var(--rail);background:var(--rail)}
  .it.meal .mk{border-color:var(--gold)}
  .it.stayin .mk{border-color:var(--accent);background:var(--accent)}
  .time{font-size:calc(13.5px * var(--fs));letter-spacing:.01em;color:var(--rail);font-weight:600}
  .it .ttl{font-size:calc(16px * var(--fs));font-weight:700;margin-top:1px;letter-spacing:-.01em}
  .it .desc{font-size:calc(13.5px * var(--fs));color:var(--ink-soft);margin-top:3px;line-height:1.5}
  .it .note{font-size:calc(12.5px * var(--fs));color:var(--muted);margin-top:4px;line-height:1.5}
  .via{
    display:inline-block;font-size:calc(12px * var(--fs));color:var(--rail);
    background:#E7ECE9;border-radius:6px;padding:2px 7px;margin-top:5px;font-weight:600;
  }

  /* ---------- map links ---------- */
  .maps{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .mp{
    display:inline-flex;align-items:center;gap:5px;
    font-size:calc(13px * var(--fs));font-weight:600;font-family:var(--sans);
    color:var(--map);text-decoration:none;
    background:#E9F4EE;border:1px solid #C3E0D0;border-radius:9px;
    padding:6px 11px 6px 9px;min-height:34px;
    transition:transform .12s ease,background .12s;
  }
  .mp:active{transform:scale(.96);background:#D9EDE2}
  .mp svg{flex:0 0 auto;width:14px;height:14px}
  .mp .arw{opacity:.5;font-size:calc(11px * var(--fs));margin-left:1px}
  .mp:focus-visible{outline:2px solid var(--map);outline-offset:2px}

  /* ---------- ticket / seats ---------- */
  details.tk{
    margin-top:8px;background:#F4F7F5;border:1px solid #CFDAD5;
    border-radius:11px;overflow:hidden;
  }
  details.tk summary{
    cursor:pointer;list-style:none;padding:9px 12px;
    font-size:calc(13px * var(--fs));font-weight:700;color:var(--rail);
    display:flex;align-items:center;gap:6px;
  }
  details.tk summary::-webkit-details-marker{display:none}
  details.tk summary::after{content:"▾";margin-left:auto;opacity:.55;font-weight:400}
  details.tk[open] summary::after{content:"▴"}
  details.tk .tkbody{padding:2px 12px 12px;border-top:1px solid #E1E8E4}
  .tkline{
    display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #E7EDE9;
    font-size:calc(12.5px * var(--fs));
  }
  .tkline:last-child{border-bottom:0}
  .tkline .k{flex:0 0 58px;color:var(--muted);font-size:calc(11.5px * var(--fs))}
  .tkline .v{flex:1;color:var(--ink-soft)}
  .tkline .v b{color:var(--ink);font-weight:700}
  .seats{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .seat{
    font-size:calc(13px * var(--fs));font-weight:700;color:var(--rail);
    background:#fff;border:1.5px solid #BCCDC5;border-radius:8px;
    padding:5px 9px;letter-spacing:.01em;
  }
  .carbadge{
    display:inline-block;font-size:calc(12px * var(--fs));font-weight:800;
    color:#fff;background:var(--rail);border-radius:7px;padding:4px 10px;margin-top:2px;
  }

  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .tg{font-size:calc(11px * var(--fs));font-weight:700;padding:3px 8px;border-radius:999px;border:1px solid}
  .tg.cash{color:var(--cash);border-color:#F0CFC2;background:#FBEEE8}
  .tg.card{color:var(--rail);border-color:#CFDAD5;background:#EDF2EF}
  .tg.ic{color:#2C6E8F;border-color:#C6DCE7;background:#EAF3F7}
  .tg.qr{color:#5C4A8C;border-color:#D6CDEB;background:#F0ECF9}
  .tg.won{color:var(--gold);border-color:#E8D6AE;background:#FAF3E2}
  .tg.warn{color:#8A2B12;border-color:#EFC9BC;background:#FBE9E3}

  /* ---------- now ---------- */
  .it.past{opacity:.42}
  .it.now{
    background:var(--now-soft);border:1px solid #DCD2F0;border-radius:13px;
    padding:12px 14px 12px 40px;margin-left:-2px;
    box-shadow:0 4px 18px rgba(110,90,166,.13);
  }
  .it.now .mk{
    left:9px;top:16px;border-color:var(--now);background:var(--now);
    animation:ring 2.2s ease-out infinite;
  }
  @keyframes ring{
    0%{box-shadow:0 0 0 0 rgba(110,90,166,.4)}
    70%{box-shadow:0 0 0 13px rgba(110,90,166,0)}
    100%{box-shadow:0 0 0 0 rgba(110,90,166,0)}
  }
  .nowtag{
    display:inline-block;font-size:calc(10.5px * var(--fs));font-weight:800;letter-spacing:.12em;
    color:#fff;background:var(--now);border-radius:5px;padding:2.5px 7px;margin-bottom:5px;
  }
  .it.now .time{color:var(--now);font-weight:700}
  .banner{
    margin:0 20px 4px;padding:11px 14px;border-radius:11px;
    background:var(--card);border:1px dashed var(--line);
    font-size:calc(13px * var(--fs));color:var(--muted);text-align:center;
  }

  /* ---------- reference ---------- */
  details.ref{
    margin:18px 20px 0;background:var(--card);border:1px solid var(--line);
    border-radius:13px;box-shadow:var(--shadow);overflow:hidden;
  }
  details.ref summary{
    cursor:pointer;list-style:none;padding:14px 16px;
    font-size:calc(14.5px * var(--fs));font-weight:700;
    display:flex;justify-content:space-between;align-items:center;
  }
  details.ref summary::-webkit-details-marker{display:none}
  details.ref summary::after{content:"＋";color:var(--muted);font-weight:400;font-size:calc(17px * var(--fs))}
  details.ref[open] summary::after{content:"－"}
  details.ref .body{padding:13px 16px 15px;border-top:1px solid var(--line)}
  .row{display:flex;gap:11px;padding:8px 0;border-bottom:1px solid #EDF0EC;font-size:calc(13px * var(--fs))}
  .row:last-child{border-bottom:0}
  .row .k{flex:0 0 74px;color:var(--muted);font-size:calc(12px * var(--fs));letter-spacing:.02em}
  .row .v{flex:1;color:var(--ink-soft);line-height:1.5}
  .row .v b{color:var(--ink)}
  .addr{font-size:calc(12px * var(--fs));color:var(--muted);word-break:keep-all;margin-top:2px}

  footer{text-align:center;color:var(--muted);font-size:calc(11.5px * var(--fs));padding:26px 20px 12px;line-height:1.7}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    ["카드","트래블월렛 · 트래블로그 · 교통카드"],
    ["유심","현진, 하은 : 인천공항 T2 1층 3번 출구에서 수령 (06~22시)<div class='addr'>엄마, 아빠, 성진 : e-SIM 미리 설치</div>"],
    ["기타","충전기 · 보조배터리 · 상비약 · 우산"]
  ]}
];

const PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>';

const mins = s => { const [h,m] = s.split(":").map(Number); return h*60+m; };
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const mapLink = name => M[name]
  ? `<a class="mp" href="${M[name]}" target="_blank" rel="noopener noreferrer">${PIN}<span>${esc(name)}</span><span class="arw">↗</span></a>`
  : `<span class="mp" style="opacity:.6">${PIN}<span>${esc(name)}</span></span>`;

function jstNow(){
  const p = new Intl.DateTimeFormat("en-CA",{
    timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit",
    hour:"2-digit",minute:"2-digit",hour12:false
  }).formatToParts(new Date()).reduce((a,x)=>(a[x.type]=x.value,a),{});
  return { date:`${p.year}-${p.month}-${p.day}`, h:+p.hour%24, m:+p.minute };
}

function effective(items){
  let last = 0;
  return items.map(it => { if(it.t) last = mins(it.t); return last; });
}

let active = 0;

function render(){
  const now = jstNow(), d = DAYS[active];
  const isToday = d.key === now.date;
  const nowM = now.h*60 + now.m;
  const eff = effective(d.items);

  let curIdx = -1;
  if(isToday){
    for(let i=0;i<eff.length;i++) if(eff[i] <= nowM) curIdx = i;
    if(nowM < eff[0]) curIdx = -1;
  }

  let h = `<section class="dayhead" style="--accent:${d.accent}">
    <div class="num">Day ${d.n} · ${d.date} (${d.dow})</div>
    <h2>${esc(d.title)}</h2>
    <div class="sub">${esc(d.sub)}</div>
    <div class="stay"><span class="k">숙소</span><span class="v"><b>${esc(d.stayName)}</b><br>${esc(d.stayNote)}</span></div>
  </section>`;

  if(isToday && curIdx === -1) h += `<div class="banner">오늘 일정이 아직 시작 전이에요 · 첫 일정 ${d.items[0].t}</div>`;
  else if(!isToday) h += `<div class="banner">오늘(${now.date.slice(5).replace("-",".")})이 아닌 다른 날짜를 보고 있어요</div>`;

  h += `<ul class="tl" style="--accent:${d.accent}">`;
  d.items.forEach((it,i)=>{
    const cls = ["it",it.type||"",isToday&&i<curIdx?"past":"",i===curIdx?"now":""].filter(Boolean).join(" ");
    const tstr = it.t ? (it.te ? `${it.t} – ${it.te}` : it.t) : "";
    h += `<li class="${cls}"><span class="mk"></span>`;
    if(i===curIdx) h += `<span class="nowtag">지금</span><br>`;
    if(tstr) h += `<div class="time">${tstr}</div>`;
    h += `<div class="ttl">${esc(it.ttl)}</div>`;
    if(it.desc) h += `<div class="desc">${esc(it.desc)}</div>`;
    if(it.via) h += `<div class="via">${esc(it.via)}</div>`;
    if(it.note) h += `<div class="note">${esc(it.note)}</div>`;
    if(it.places && it.places.length) h += `<div class="maps">${it.places.map(mapLink).join("")}</div>`;
    if(it.tags && it.tags.length) h += `<div class="tags">${it.tags.map(t=>`<span class="tg ${t[0]}">${esc(t[1])}</span>`).join("")}</div>`;
    if(it.ticket){
      const k = it.ticket;
      h += `<details class="tk"><summary>🎫 좌석 정보 보기</summary><div class="tkbody">
        <div class="tkline"><span class="k">호차</span><span class="v"><span class="carbadge">${esc(k.car)}</span></span></div>
        <div class="tkline"><span class="k">좌석</span><span class="v"><div class="seats">${k.seats.map(x=>`<span class="seat">${esc(x)}</span>`).join("")}</div></span></div>
        <div class="tkline"><span class="k">예약번호</span><span class="v"><b>${esc(k.res)}</b> · 어른 5명 · ${esc(k.fare)}</span></div>
        ${k.note?`<div class="tkline"><span class="k">참고</span><span class="v">${esc(k.note)}</span></div>`:""}
        <div class="tkline"><span class="k">발권</span><span class="v">QR코드·발권코드는 <b>Gmail 예약 메일</b>에서 확인하세요</span></div>
      </div></details>`;
    }
    h += `</li>`;
  });
  h += `</ul>`;

  h += REF.map(r=>`<details class="ref"><summary>${esc(r.q)}</summary><div class="body">` +
      r.rows.map(x=>{
        let v = x[1];
        if(v.startsWith("MAP:")){
          const rest = v.slice(4), cut = rest.indexOf("<div");
          const nm = cut < 0 ? rest : rest.slice(0,cut);
          v = `<div class="maps" style="margin-top:0">${mapLink(nm)}</div>` + (cut<0?"":rest.slice(cut));
        }
        return `<div class="row"><span class="k">${esc(x[0])}</span><span class="v">${v}</span></div>`;
      }).join("") + `</div></details>`).join("");

  document.getElementById("stage").innerHTML = h;
  document.querySelectorAll(".tab").forEach((b,i)=>b.setAttribute("aria-selected", i===active));
}

function buildTabs(){
  const now = jstNow();
  document.getElementById("tabs").innerHTML = DAYS.map((d,i)=>
    `<button class="tab${d.key===now.date?" today":""}" role="tab" aria-selected="false" data-i="${i}">
      <span class="n">Day ${d.n}</span><span class="d">${d.date} ${d.dow}</span>
    </button>`).join("");
  document.querySelectorAll(".tab").forEach(b=>{
    b.addEventListener("click",()=>{ active=+b.dataset.i; render(); window.scrollTo({top:0,behavior:"smooth"}); });
  });
}

function tick(){
  const n = jstNow();
  document.getElementById("clk").textContent =
    String(n.h).padStart(2,"0")+":"+String(n.m).padStart(2,"0");
  const d = DAYS.find(x=>x.key===n.date);
  document.getElementById("clkday").textContent = d ? `일본 현지 시각 · Day ${d.n}` : "일본 현지 시각";
}

function setFS(v, save){
  document.documentElement.style.setProperty("--fs", v);
  document.querySelectorAll(".fsbtn").forEach(b=>
    b.setAttribute("aria-pressed", String(b.dataset.fs)===String(v)));
  if(save){ try{ localStorage.setItem("hok-fs", v); }catch(e){} }
}
document.querySelectorAll(".fsbtn").forEach(b=>
  b.addEventListener("click",()=>setFS(b.dataset.fs,true)));
(function(){ let v="1"; try{ v = localStorage.getItem("hok-fs")||"1"; }catch(e){} setFS(v,false); })();

(function init(){
  const today = jstNow().date;
  const i = DAYS.findIndex(d=>d.key===today);
  active = i>=0 ? i : 0;
  buildTabs(); tick(); render();
  setInterval(()=>{ tick(); render(); }, 30000);
})();
</script>
</body>
</html>
